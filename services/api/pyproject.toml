[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-arena-api"
version = "0.1.0"
description = "Math Arena - 数学垂类大模型后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]",
    "pydantic>=2.6",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "httpx",
    "redis>=5.0",
    "pgvector",
    "structlog",
    "python-jose[cryptography]",
    "argon2-cffi>=23.1.0",
    "python-dotenv",
    # M2 新增依赖（与 requirements.txt 对齐，勿再漂移）
    "boto3>=1.34.0",
    "sympy>=1.12.0",
    "PyMuPDF>=1.24.0",
    "antlr4-python3-runtime==4.11",
    "rapidocr_onnxruntime>=1.3.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.2,<2",
    "numpy>=1.26.0",
    # Butler Kernel v2（阶段3）：结构化 Planner 精确锁定补丁版本，禁止浮动>=；最小核心包 slim，不带头 extras
    "pydantic-ai-slim==2.31.1",
    # M3 教师端：资源上传 multipart（FastAPI UploadFile）
    "python-multipart>=0.0.9",
    "tencentcloud-sdk-python>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",  # for test client
    "ruff",
    "black",
    "mypy",
    "respx",  # httpx mock
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # Depends() in function defaults (FastAPI idiom)
]

[tool.ruff.lint.per-file-ignores]
# conftest 必须在任何 app.* import 之前写 DATABASE_URL/M3 环境变量
# （app.models.database 在 import 时创建 engine），推导 TEST_DB 的函数定义
# 因此先于 import 块——E402 是该文件固有的、有意为之的模式。
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "asyncpg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "eval"]
