# verbs.yaml —— 课标行为动词分层表 + 六大核心素养动词（目标双线生成的约束词表）
# 依据：《普通高中数学课程标准（2017 年版 2020 修订）》行为动词分层
# 用途：lesson/outline.j2 与 lesson/section.j2 的目标句校验——每条目标 = 素养词 + 行为动词
version: 1.0.0

knowledge_skill_line:
  了解:
    verbs: [知道, 了解, 识别, 说出, 列举, 辨认, 描述, 举例说明, 直观感知]
    level_hint: "能回忆、辨认、举例"
  理解:
    verbs: [理解, 解释, 说明, 归纳, 比较, 区分, 转化, 概括, 会用]
    level_hint: "能解释内涵、与相关知识建立联系"
  掌握:
    verbs: [掌握, 运用, 应用, 推导, 证明, 求解, 分析, 解决, 判定]
    level_hint: "能在新情境中解决问题"
  运用:
    verbs: [综合运用, 灵活运用, 构造, 设计, 评价, 建立模型]
    level_hint: "综合多个知识块处理复杂问题"

process_verbs:
  verbs: [经历, 体验, 感悟, 探索, 观察, 发现, 尝试, 交流]
  note: "过程目标动词，用于素养线的活动描述"

literacies:
  数学抽象:
    L1: [抽象, 归纳, 了解, 感悟]
    L2: [概括, 类比, 提炼]
    L3: [建模抽象, 形成通性通法]
  逻辑推理:
    L1: [模仿, 证明, 了解]
    L2: [推断, 归纳论证, 类比发现]
    L3: [提出猜想, 严谨论证, 批判性思考]
  数学建模:
    L1: [感知, 模仿建模]
    L2: [分析实际问题, 建立方程或函数模型]
    L3: [设计建模方案, 检验与优化模型]
  直观想象:
    L1: [观察图形, 借助图形理解]
    L2: [画图, 图形变换, 数形结合]
    L3: [借助几何直观发现思路, 空间想象]
  数学运算:
    L1: [执行运算, 求值]
    L2: [选择运算方法, 简化运算]
    L3: [设计运算策略, 估算与验算]
  数据分析:
    L1: [收集数据, 读取图表]
    L2: [整理数据, 计算统计量]
    L3: [依据数据作出推断, 评价随机性]

# 目标句合法性校验规则（生成后程序断言用）：
# 1. 每条目标句必须含 knowledge_skill_line 任一动词 或 process_verbs 任一动词；
# 2. 每条素养目标必须挂六大素养之一的具体条目，禁止只写「核心素养」；
# 3. 禁止出现 cliche.yaml hard 级词表。
