# cliche.yaml —— 反套话词表（B2 §4，两级检测；前端 cliche.ts 无独立词表文件，本表为权威种子）
# 用途：教案/讲评生成后的套话检测（规则命中 ∪ LLM 判别双保险）与一键重写。
# 红线：本表只是【检测目标】，提示词输出指令里永远不许出现这些短语。
# tier: hard = 硬套话（必标红，一键重写）；weak = 弱化词（提示级，连续堆砌或无上下文具体化时标黄）
version: 1.0.0

hard:
  - pattern: "激发(学生)?(学习)?兴趣"
    note: "不可检验；重写为具体可观察行为（如『能用定义说清两例』）"
  - pattern: "培养(学生)?(的)?核心素养"
    note: "素养必须落到具体条目+行为动词，不得笼统挂名"
  - pattern: "突出(重点|难点)"
    note: "重难点必须写明内容与突破策略"
  - pattern: "提高(学生)?(的)?综合(素质|能力)"
  - pattern: "培养(学生)?(的)?创新(精神|意识|能力)"
  - pattern: "(培养|提升)(学生)?(的)?自主学习(能力)?"
  - pattern: "寓教于乐"
  - pattern: "全面发展"
  - pattern: "以生为本|以学生为本|以人为本"
  - pattern: "(增强|提高)课堂(效率|实效)"
  - pattern: "打造高效课堂"
  - pattern: "向(课堂|45分钟)要(质量|效率)"
  - pattern: "为终身发展(奠定|打下)基础"
  - pattern: "落实立德树人根本任务"
    note: "作为空挂口号出现时命中；若与具体课题内容绑定则由 LLM 判别豁免"
  - pattern: "(培养|发展)学生(的)?数学(思维|能力)$"
    note: "无具体思维类型（抽象/推理/建模/直观/运算/数据）时命中"
  - pattern: "乐学善学"
  - pattern: "快速提高(成绩|数学水平)"
  - pattern: "(轻松|快乐)学数学"
  - pattern: "(充分|有效)调动(学生)?(的)?积极性"
  - pattern: "营造(良好的?)(课堂|学习)氛围"

weak:
  - pattern: "因材施教"
    note: "必须伴随具体分层动作，否则是空话"
  - pattern: "循序渐进"
  - pattern: "举一反三"
    note: "须落到变式题/迁移任务的具体安排"
  - pattern: "精讲精练"
  - pattern: "当堂达标|堂堂清"
  - pattern: "以学生为主体"
  - pattern: "教师主导、学生主体"
  - pattern: "合作探究|小组合作"
    note: "无分组任务/分工/产出说明时命中"
  - pattern: "动手(操作|实践)"
    note: "无具体操作对象时命中"
  - pattern: "数形结合"
    note: "须说明哪个图形辅助哪个代数对象"
  - pattern: "化归|转化思想"
    note: "须指明从什么化到什么"
  - pattern: "分类讨论"
    note: "须列出分类标准"
  - pattern: "函数与方程思想"
  - pattern: "整体代换"
  - pattern: "(夯实|打牢)基础"
  - pattern: "温故知新"
  - pattern: "(及时|适时)反馈"
  - pattern: "关注(每一位|每个)学生"
  - pattern: "(积极|主动)引导"
  - pattern: "深入浅出"
  - pattern: "类比迁移"
  - pattern: "(渗透|融入)(数学|德育)(思想|教育)"
  - pattern: "(培养|增强)学生(的)?(自信心|成就感)"
  - pattern: "(激发|培养)(学生)?(的)?求知欲"
  - pattern: "(培养|提升)学生(的)?表达能力"
  - pattern: "构建(高效|活力)课堂"
  - pattern: "(发展|提升)核心素养"
  - pattern: "深度学习"
    note: "滥用重灾区；无具体认知任务时命中"
  - pattern: "最近发展区"
    note: "教学理论名词堆砌；无对应支架设计时命中"
  - pattern: "三维目标"
    note: "旧课标表述，新课标应用素养双线"
  - pattern: "(先学后教|以学定教)"
  - pattern: "(设计|创设)(问题)?情境(导入)?"
    note: "须写出具体情境内容，否则命中"

# LLM 判别准则（双保险的第二道）：
# 1. 句子是否可检验——能否设计一个课堂观察点验证它发生了？
# 2. 是否指向本课题的具体内容——换个课题句子是否照样成立？成立即套话。
# 3. 弱化词命中但上下文已具体化的，LLM 可判豁免并在结果中说明理由。
