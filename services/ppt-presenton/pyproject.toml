[project]
name = "ppt-presenton-adapter"
version = "0.2.0"
description = "Presenton 私有 adapter（8201）· 仅供 8200 服务端调用；loopback 绑定（R15）；R21 真实引擎（逐页 OOXML 构建 + PowerPoint COM 渲染）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-pptx>=1.0",
    "pillow>=10.0",
    "fonttools>=4.50",
    "matplotlib>=3.8",
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]