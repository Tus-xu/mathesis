# Math Arena 云服务器 nginx 配置（web 容器 /etc/nginx/conf.d/default.conf）
#
# 与前端仓库根 nginx.conf 的区别：那份是本地 dev 用（proxy_pass host.docker.internal:8000），
# 这份走 compose 网络内的服务名，且补齐三端全部后端前缀。
#
# 三端 → 后端映射：
#   学生端  /api/*                 → api:8000（agent / v1_compat / 题库 / 班级 …）
#   科研端  /api/research-vnext/*  → api:8000 网关（由 8000 注入 HMAC 后再转 8300）
#   教师端  /api/teacher-v3/*      → teacher-api:8100（备课中心 / 双师课堂 / 课件内核）
#   教师端  /api/ppt-studio-v2/*   → ppt-studio-v2:8200（PPT Studio V2）
#
# nginx 前缀匹配规则：API location 一律加 ^~（前缀命中后不再查正则）——否则
# 静态资源缓存正则 location ~* \.(jpg|png|...)$ 会抢占 .jpg 结尾的 API 路径
# （2026-10-11 实测：教材切片插图 /api/teacher-v3/textbook-v2/slice-images/*.jpg 被
# 静态缓存 location 截胡 → nginx 层 404）。

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Docker 内置 DNS：上游主机名在请求时解析，避免教师/PPT 容器未起时 nginx 启动失败
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 授权中心安全基线（仅本端：style 仍被旧页面使用，迁移完成后移除 unsafe-inline）
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # 服务器版：反代到 compose 网络内的 api 服务（不是 host.docker.internal）
    client_max_body_size 50m;

    # ── 教师端 8100：备课中心 / 双师课堂 / 课件内核 / 教案内核 ──
    # 生成类接口（大纲/教案/逐页）单次可长达 2-3 分钟，必须放开读超时。
    location ^~ /api/teacher-v3/ {
        set $teacher_upstream http://teacher-api:8100;
        proxy_pass $teacher_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 教师端 8200：PPT Studio V2（浏览器不可直连 8201） ──
    location ^~ /api/ppt-studio-v2/ {
        set $ppt_upstream http://ppt-studio-v2:8200;
        proxy_pass $ppt_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 学生端 + 科研端网关（8000） ──
    location ^~ /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持（AI 对话逐字输出）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 前端路由 - SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存：确保每次发版后拿到最新页面（assets 带 hash 不受影响）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # r7-deploy mjs 修复：pdf.js worker (.mjs) 需 text/javascript MIME
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
